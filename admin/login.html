<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Acesso da equipe — RM Motos</title><meta name="description" content="Acesso individual da administração e equipe do balcão."><meta name="theme-color" content="#0C1425">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/app.css"><link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="tela-admin" data-raiz="..">
<div class="login-tela"><div class="login-tela__formas" aria-hidden="true"><span></span><span></span></div><div class="login-caixa">
<a class="marca" href="../index.html"><span class="marca__simbolo" id="simbolo-marca"></span><span class="marca__texto"><span class="marca__nome">RM Motos</span><span class="marca__tag">Peças e acessórios</span></span></a>
<div class="login-caixa__marca"><div><h1>Acesso da equipe</h1><p class="texto-2 pequeno">Entre com seu e-mail e sua senha individual.</p></div></div>
<form id="form-login" method="post">
<div class="campo"><label class="campo__rotulo" for="usuario">E-mail</label><input class="entrada" id="usuario" name="email" type="email" required maxlength="254" autocomplete="username" placeholder="Seu e-mail de acesso"></div>
<div class="campo"><label class="campo__rotulo" for="senha">Senha</label><div class="admin-password"><input class="entrada" id="senha" name="password" type="password" required maxlength="128" autocomplete="current-password"><button class="btn btn--contorno btn--pequeno" type="button" id="mostrar-senha" aria-pressed="false" aria-label="Mostrar senha">Mostrar</button></div></div>
<label class="admin-check"><input type="checkbox" name="remember"> Manter conectado neste dispositivo</label>
<p id="erro-login" role="status" aria-live="polite"></p><button class="btn btn--grande btn--bloco mt-3" type="submit">Entrar no painel</button>
</form>
<p class="micro texto-2 mt-3">O acesso é liberado pela proprietária. Cada funcionário deve criar sua própria conta na loja antes de solicitar a autorização.</p>
<div class="admin-actions"><a href="../conta.html">Criar conta ou recuperar senha</a><a href="../index.html">← Voltar para a loja</a></div>
</div></div>
<script type="module">
import { api } from '../assets/js/api.js';
import { icone } from '../assets/js/utils.js';
import { destinoPorPerfil } from '../assets/js/admin.js';
import {montarLoginBalcao} from '../assets/js/admin-balcao.js';
import {LOJA} from '../assets/js/dados.js';
import {carregarLoja} from '../assets/js/loja-api.js';
import {aplicarMarca} from '../assets/js/marca.js';
const marcaLogin=document.querySelector('.login-caixa .marca, .marca');
aplicarMarca(marcaLogin, LOJA.nome);
carregarLoja().then(()=>aplicarMarca(marcaLogin, LOJA.nome));
const form=document.getElementById('form-login'), feedback=document.getElementById('erro-login');
const state=new URLSearchParams(location.search).get('acesso');
if(state==='negado') feedback.textContent='Esta conta não tem autorização para acessar os painéis da equipe.';
if(state==='expirado') feedback.textContent='Sua sessão expirou. Entre novamente.';
api('/auth/me').then(({user})=>{const destination=destinoPorPerfil(user);if(destination)location.replace(destination);}).catch(()=>{});
document.getElementById('mostrar-senha').addEventListener('click',event=>{const input=document.getElementById('senha'),show=input.type==='password';input.type=show?'text':'password';event.currentTarget.textContent=show?'Ocultar':'Mostrar';event.currentTarget.setAttribute('aria-pressed',String(show));event.currentTarget.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');});
form.addEventListener('submit',async event=>{
  event.preventDefault(); if(!form.reportValidity())return;
  const button=form.querySelector('[type="submit"]'); button.disabled=true; feedback.textContent='Verificando acesso…';
  try {
    const {user}=await api('/auth/login',{method:'POST',body:{email:form.elements.email.value.trim(),password:form.elements.password.value,remember:form.elements.remember.checked}});
    const destination=destinoPorPerfil(user);
    if(!destination) { await api('/auth/logout',{method:'POST'}); throw new Error('Esta conta não tem autorização para acessar os painéis da equipe.'); }
    location.replace(destination);
  } catch(error) { feedback.textContent=error.message; button.disabled=false; }
});
form.dataset.authReady='true';
montarLoginBalcao();
</script>
</body></html>
